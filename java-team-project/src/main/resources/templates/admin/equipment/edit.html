<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Редактирование оборудования')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <h1>Редактирование оборудования</h1>

    <form th:action="@{/admin/equipment/{id}(id=${equipment.id})}" method="post">
        <div class="error-message" th:if="${error}" th:text="${error}">Ошибка</div>

        <label>
            Название
            <input type="text" name="name" required maxlength="120" th:value="${equipment.name}">
        </label>

        <label>
            Описание
            <textarea name="description" maxlength="500" th:text="${equipment.description}"></textarea>
        </label>

        <label class="checkbox">
            <input type="checkbox" name="active" value="true" th:checked="${equipment.active}">
            Активно
        </label>

        <div class="actions">
            <button class="btn primary" type="submit">Сохранить</button>
            <a class="btn" th:href="@{/admin/equipment}">Отмена</a>
        </div>
    </form>
</main>
</body>
</html>
