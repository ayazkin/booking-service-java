<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Оборудование')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <div class="page-header">
        <h1>Оборудование</h1>
        <a class="btn primary" th:href="@{/admin/equipment/new}">Добавить</a>
    </div>

    <div class="empty" th:if="${equipment.empty}">
        Оборудование не добавлено
    </div>

    <table class="admin-table" th:if="${!equipment.empty}">
        <thead>
        <tr>
            <th>Название</th>
            <th>Описание</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${equipment}">
            <td th:text="${item.name}">Проектор</td>
            <td th:text="${item.description ?: '-'}">-</td>
            <td>
                <span class="status" th:text="${item.active ? 'Активно' : 'Отключено'}">Активно</span>
            </td>
            <td>
                <div class="table-actions">
                    <a class="btn" th:href="@{/admin/equipment/{id}/edit(id=${item.id})}">Редактировать</a>
                    <form th:if="${item.active}"
                          th:action="@{/admin/equipment/{id}/deactivate(id=${item.id})}"
                          method="post">
                        <button class="btn danger" type="submit">Отключить</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
