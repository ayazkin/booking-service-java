<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Новое оборудование')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <h1>Новое оборудование</h1>

    <form th:action="@{/admin/equipment}" method="post">
        <div class="error-message" th:if="${error}" th:text="${error}">Ошибка</div>

        <label>
            Название
            <input type="text" name="name" required maxlength="120">
        </label>

        <label>
            Описание
            <textarea name="description" maxlength="500" th:text="${description}"></textarea>
        </label>

        <div class="actions">
            <button class="btn primary" type="submit">Создать</button>
            <a class="btn" th:href="@{/admin/equipment}">Отмена</a>
        </div>
    </form>
</main>
</body>
</html>
