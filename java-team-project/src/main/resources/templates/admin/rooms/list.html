<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Аудитории')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <div class="admin-page-header">
        <h1>Аудитории</h1>
        <a class="btn primary" th:href="@{/admin/rooms/new}">Добавить</a>
    </div>

    <div class="empty" th:if="${rooms.empty}">
        Аудитории не добавлены
    </div>

    <table th:if="${!rooms.empty}">
        <thead>
        <tr>
            <th>Номер</th>
            <th>Название</th>
            <th>Вместимость</th>
            <th>Этаж</th>
            <th>Оборудование</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="room : ${rooms}">
            <td th:text="${room.number}">101</td>
            <td th:text="${room.name}">Лекционная аудитория</td>
            <td th:text="${room.capacity}">30</td>
            <td th:text="${room.floor}">1</td>
            <td>
                <span th:if="${#sets.isEmpty(room.equipment)}">-</span>
                <span th:each="item, itemStatus : ${room.equipment}">
                    <span th:text="${item.name}">Проектор</span><span th:if="${!itemStatus.last}">, </span>
                </span>
            </td>
            <td>
                <span class="status" th:text="${room.active ? 'Активна' : 'Отключена'}">Активна</span>
            </td>
            <td>
                <div class="actions">
                    <a class="btn" th:href="@{/admin/rooms/{id}/edit(id=${room.id})}">Редактировать</a>
                    <form th:if="${room.active}"
                          th:action="@{/admin/rooms/{id}/deactivate(id=${room.id})}"
                          method="post" >
                        <button class="btn" type="submit">Отключить</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
