<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Новая аудитория')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <h1>Новая аудитория</h1>

    <form th:action="@{/admin/rooms}" method="post">
        <div class="error-message" th:if="${error}" th:text="${error}">Ошибка</div>

        <label>
            Номер
            <input type="text" name="number" required maxlength="30" th:value="${room != null ? room.number : ''}">
        </label>

        <label>
            Название
            <input type="text" name="name" required maxlength="120" th:value="${room != null ? room.name : ''}">
        </label>

        <label>
            Вместимость
            <input type="number" name="capacity" required min="1" th:value="${room != null ? room.capacity : ''}">
        </label>

        <label>
            Этаж
            <input type="number" name="floor" required th:value="${room != null ? room.floor : ''}">
        </label>

        <label>
            Описание
            <textarea name="description" maxlength="1000" th:text="${room != null ? room.description : ''}"></textarea>
        </label>

        <label>
            Оборудование
            <select name="equipmentIds" multiple size="6">
                <option th:each="item : ${equipmentOptions}"
                        th:value="${item.id}"
                        th:text="${item.name + (item.active ? '' : ' (отключено)')}"
                        th:selected="${selectedEquipmentIds != null and selectedEquipmentIds.contains(item.id)}">
                    Проектор
                </option>
            </select>
        </label>

        <div class="actions">
            <button class="btn primary" type="submit">Создать</button>
            <a class="btn" th:href="@{/admin/rooms}">Отмена</a>
        </div>
    </form>
</main>
</body>
</html>
