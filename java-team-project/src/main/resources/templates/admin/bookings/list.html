<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Управление бронированиями')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <h1>Бронирования (админ)</h1>

    <div class="success-message" th:if="${success}" th:text="${success}">Успешно</div>
    <div class="error-message" th:if="${error}" th:text="${error}">Ошибка</div>

    <form class="filters" th:action="@{/admin/bookings}" method="get">
        <input type="hidden" name="size" th:value="${bookingsPage.size}">

        <label>
            Статус
            <select name="status">
                <option value="">Все статусы</option>
                <option th:each="item : ${statuses}"
                        th:value="${item}"
                        th:text="${item}"
                        th:selected="${status != null and item == status}">
                    APPROVED
                </option>
            </select>
        </label>

        <label>
            Аудитория
            <select name="roomId">
                <option value="">Все комнаты</option>
                <option th:each="room : ${rooms}"
                        th:value="${room.id}"
                        th:text="${room.number + ' - ' + room.name}"
                        th:selected="${roomId != null and room.id == roomId}">
                    101 - Лекционная
                </option>
            </select>
        </label>

        <label>
            Пользователь
            <input type="text" name="userQuery" th:value="${userQuery}" placeholder="Имя или email">
        </label>

        <label>
            Начало с
            <input type="datetime-local" name="startFrom" th:value="${startFrom}">
        </label>

        <label>
            Начало по
            <input type="datetime-local" name="startTo" th:value="${startTo}">
        </label>

        <div class="filter-actions">
            <button class="btn primary" type="submit">Найти</button>
            <a class="btn" th:href="@{/admin/bookings}">Сбросить</a>
        </div>
    </form>

    <div class="empty" th:if="${bookingsPage.empty}">
        Бронирования не найдены
    </div>

    <table th:if="${!bookingsPage.empty}">
        <thead>
        <tr>
            <th>Пользователь</th>
            <th>Аудитория</th>
            <th>Начало</th>
            <th>Конец</th>
            <th>Статус</th>
            <th>Комментарий</th>
            <th>Ответ админа</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookingsPage.content}">
            <td>
                <span th:text="${booking.user.username}" >user</span><br>
                <small th:text="${booking.user.email}" >user@example.com</small>
            </td>
            <td th:text="${booking.room.number + ' - ' + booking.room.name}">101 - Лекционная</td>
            <td th:text="${#temporals.format(booking.startTime, 'dd.MM.yyyy HH:mm')}">14.05.2026 10:00</td>
            <td th:text="${#temporals.format(booking.endTime, 'dd.MM.yyyy HH:mm')}">14.05.2026 12:00</td>
            <td>
                <span th:class="'badge ' + ${booking.status.name().toLowerCase()}"
                      th:text="${booking.status}">APPROVED</span>
            </td>
            <td th:text="${booking.comment ?: '-'}">-</td>
            <td th:text="${booking.adminComment ?: '-'}">-</td>
            <td>
                <div class="actions">
                    <form class="cancel-form"
                          th:if="${booking.status.name() == 'APPROVED'}"
                          th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}"
                          method="post" >
                        <textarea name="adminComment" required maxlength="1000" placeholder="Причина отмены" style="padding: 6px; font-size: 12px; min-height: 60px;"></textarea>
                        <button class="btn" type="submit">Отменить</button>
                    </form>
                    <span th:if="${booking.status.name() != 'APPROVED'}">-</span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <nav class="pagination" th:if="${bookingsPage.totalPages > 1}" aria-label="Пагинация">
        <a th:if="${bookingsPage.hasPrevious()}"
           th:href="@{/admin/bookings(page=${bookingsPage.number - 1},size=${bookingsPage.size},status=${status},roomId=${roomId},userQuery=${userQuery},startFrom=${startFrom},startTo=${startTo})}">
            Назад
        </a>
        <span class="disabled" th:if="${!bookingsPage.hasPrevious()}">Назад</span>

        <span th:each="pageNumber : ${#numbers.sequence(0, bookingsPage.totalPages - 1)}">
            <span class="current"
                  th:if="${pageNumber == bookingsPage.number}"
                  th:text="${pageNumber + 1}">1</span>
            <a th:if="${pageNumber != bookingsPage.number}"
               th:href="@{/admin/bookings(page=${pageNumber},size=${bookingsPage.size},status=${status},roomId=${roomId},userQuery=${userQuery},startFrom=${startFrom},startTo=${startTo})}"
               th:text="${pageNumber + 1}">2</a>
        </span>

        <a th:if="${bookingsPage.hasNext()}"
           th:href="@{/admin/bookings(page=${bookingsPage.number + 1},size=${bookingsPage.size},status=${status},roomId=${roomId},userQuery=${userQuery},startFrom=${startFrom},startTo=${startTo})}">
            Вперед
        </a>
        <span class="disabled" th:if="${!bookingsPage.hasNext()}">Вперед</span>
    </nav>
</main>
</body>
</html>
