<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудитории</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f6f7f9;
        }

        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 32px;
            font-weight: 700;
        }

        .filters {
            display: grid;
            grid-template-columns: minmax(180px, 2fr) minmax(130px, 1fr) minmax(110px, 1fr) minmax(180px, 1.5fr);
            gap: 14px;
            align-items: end;
            margin-bottom: 20px;
            padding: 16px;
            background: #ffffff;
            border: 1px solid #d7dce2;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cfd6df;
            font: inherit;
            background: #ffffff;
        }

        .checkbox {
            display: flex;
            gap: 8px;
            align-items: center;
            min-height: 40px;
            font-weight: 700;
        }

        .checkbox input {
            width: auto;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button,
        .button-link {
            display: inline-block;
            padding: 10px 12px;
            border: 1px solid #cfd6df;
            color: #1f2937;
            background: #ffffff;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            border-color: #111827;
            background: #111827;
            color: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border: 1px solid #d7dce2;
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #eef2f7;
            font-size: 14px;
            font-weight: 700;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty {
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d7dce2;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 20px;
        }

        .pagination a,
        .pagination span {
            min-width: 40px;
            padding: 9px 12px;
            box-sizing: border-box;
            border: 1px solid #cfd6df;
            color: #1f2937;
            background: #ffffff;
            text-align: center;
            text-decoration: none;
        }

        .pagination .current {
            border-color: #111827;
            background: #111827;
            color: #ffffff;
        }

        .pagination .disabled {
            color: #8a94a3;
            background: #eef2f7;
        }

        @media (max-width: 800px) {
            .filters {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Аудитории</h1>

    <form class="filters" th:action="@{/rooms}" method="get">
        <input type="hidden" name="filter" value="true">
        <input type="hidden" name="size" th:value="${roomsPage.size}">

        <label>
            Номер или название
            <input type="text" name="query" th:value="${query}">
        </label>

        <label>
            Вместимость от
            <input type="number" name="minCapacity" min="1" th:value="${minCapacity}">
        </label>

        <label>
            Этаж
            <input type="number" name="floor" th:value="${floor}">
        </label>

        <label>
            Оборудование
            <select name="equipmentId">
                <option value="">Любое</option>
                <option th:each="item : ${equipmentOptions}"
                        th:value="${item.id}"
                        th:text="${item.name}"
                        th:selected="${equipmentId != null and item.id == equipmentId}">
                    Проектор
                </option>
            </select>
        </label>

        <label class="checkbox">
            <input type="checkbox" name="activeOnly" value="true" th:checked="${activeOnly}">
            Только активные
        </label>

        <div class="filter-actions">
            <button class="primary" type="submit">Найти</button>
            <a class="button-link" th:href="@{/rooms}">Сбросить</a>
        </div>
    </form>

    <div class="empty" th:if="${roomsPage.empty}">
        Нет аудиторий по заданным фильтрам
    </div>

    <table th:if="${!roomsPage.empty}">
        <thead>
        <tr>
            <th>Номер</th>
            <th>Название</th>
            <th>Вместимость</th>
            <th>Этаж</th>
            <th>Оборудование</th>
            <th>Описание</th>
            <th>Бронь</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="room : ${roomsPage.content}">
            <td th:text="${room.number}">101</td>
            <td th:text="${room.name}">Лекционная аудитория</td>
            <td th:text="${room.capacity}">30</td>
            <td th:text="${room.floor}">1</td>
            <td>
                <span th:if="${#sets.isEmpty(room.equipment)}">-</span>
                <span th:each="item, itemStatus : ${room.equipment}">
                    <span th:text="${item.name}">Проектор</span><span th:if="${!itemStatus.last}">, </span>
                </span>
            </td>
            <td th:text="${room.description ?: '-'}">-</td>
            <td>
                <a class="button-link"
                   th:if="${room.active}"
                   th:href="@{/bookings/new(roomId=${room.id})}">
                    Забронировать
                </a>
                <span th:if="${!room.active}">Недоступна</span>
            </td>
        </tr>
        </tbody>
    </table>

    <nav class="pagination" th:if="${roomsPage.totalPages > 1}" aria-label="Пагинация">
        <a th:if="${roomsPage.hasPrevious()}"
           th:href="@{/rooms(page=${roomsPage.number - 1},size=${roomsPage.size},query=${query},minCapacity=${minCapacity},floor=${floor},equipmentId=${equipmentId},activeOnly=${activeOnly},filter='true')}">
            Назад
        </a>
        <span class="disabled" th:if="${!roomsPage.hasPrevious()}">Назад</span>

        <span th:each="pageNumber : ${#numbers.sequence(0, roomsPage.totalPages - 1)}">
            <span class="current"
                  th:if="${pageNumber == roomsPage.number}"
                  th:text="${pageNumber + 1}">1</span>
            <a th:if="${pageNumber != roomsPage.number}"
               th:href="@{/rooms(page=${pageNumber},size=${roomsPage.size},query=${query},minCapacity=${minCapacity},floor=${floor},equipmentId=${equipmentId},activeOnly=${activeOnly},filter='true')}"
               th:text="${pageNumber + 1}">2</a>
        </span>

        <a th:if="${roomsPage.hasNext()}"
           th:href="@{/rooms(page=${roomsPage.number + 1},size=${roomsPage.size},query=${query},minCapacity=${minCapacity},floor=${floor},equipmentId=${equipmentId},activeOnly=${activeOnly},filter='true')}">
            Вперед
        </a>
        <span class="disabled" th:if="${!roomsPage.hasNext()}">Вперед</span>
    </nav>
</main>
</body>
</html>
