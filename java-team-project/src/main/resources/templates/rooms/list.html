<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудитории</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f6f7f9;
        }

        main {
            max-width: 1040px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 32px;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border: 1px solid #d7dce2;
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #eef2f7;
            font-size: 14px;
            font-weight: 700;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty {
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d7dce2;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 20px;
        }

        .pagination a,
        .pagination span {
            min-width: 40px;
            padding: 9px 12px;
            box-sizing: border-box;
            border: 1px solid #cfd6df;
            color: #1f2937;
            background: #ffffff;
            text-align: center;
            text-decoration: none;
        }

        .pagination .current {
            border-color: #111827;
            background: #111827;
            color: #ffffff;
        }

        .pagination .disabled {
            color: #8a94a3;
            background: #eef2f7;
        }
    </style>
</head>
<body>
<main>
    <h1>Аудитории</h1>

    <div class="empty" th:if="${roomsPage.empty}">
        Нет доступных аудиторий
    </div>

    <table th:if="${!roomsPage.empty}">
        <thead>
        <tr>
            <th>Номер</th>
            <th>Название</th>
            <th>Вместимость</th>
            <th>Этаж</th>
            <th>Описание</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="room : ${roomsPage.content}">
            <td th:text="${room.number}">101</td>
            <td th:text="${room.name}">Лекционная аудитория</td>
            <td th:text="${room.capacity}">30</td>
            <td th:text="${room.floor}">1</td>
            <td th:text="${room.description ?: '-'}">-</td>
        </tr>
        </tbody>
    </table>

    <nav class="pagination" th:if="${roomsPage.totalPages > 1}" aria-label="Пагинация">
        <a th:if="${roomsPage.hasPrevious()}"
           th:href="@{/rooms(page=${roomsPage.number - 1},size=${roomsPage.size})}">
            Назад
        </a>
        <span class="disabled" th:if="${!roomsPage.hasPrevious()}">Назад</span>

        <span th:each="pageNumber : ${#numbers.sequence(0, roomsPage.totalPages - 1)}">
            <span class="current"
                  th:if="${pageNumber == roomsPage.number}"
                  th:text="${pageNumber + 1}">1</span>
            <a th:if="${pageNumber != roomsPage.number}"
               th:href="@{/rooms(page=${pageNumber},size=${roomsPage.size})}"
               th:text="${pageNumber + 1}">2</a>
        </span>

        <a th:if="${roomsPage.hasNext()}"
           th:href="@{/rooms(page=${roomsPage.number + 1},size=${roomsPage.size})}">
            Вперед
        </a>
        <span class="disabled" th:if="${!roomsPage.hasNext()}">Вперед</span>
    </nav>
</main>
</body>
</html>
