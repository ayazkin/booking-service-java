<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ошибка сервера')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="error-page">
    <section class="error-panel">
        <p class="error-code" th:text="${status} ?: '500'">500</p>
        <h1>Что-то пошло не так</h1>
        <p th:text="${message} ?: 'Мы уже получили информацию об ошибке. Попробуйте повторить действие позже.'">
            Мы уже получили информацию об ошибке. Попробуйте повторить действие позже.
        </p>
        <div class="actions">
            <a th:href="@{/}" class="btn primary">На главную</a>
            <a th:href="@{/rooms}" class="btn">К аудиториям</a>
        </div>
    </section>
</main>
</body>
</html>
