<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f6f7f9;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 72px 20px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 34px;
        }

        p {
            margin: 0 0 20px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 10px 14px;
            color: #ffffff;
            background: #111827;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <h1>404</h1>
    <p th:text="${message}">Page not found</p>
    <a th:href="@{/rooms}">Go to rooms</a>
</main>
</body>
</html>
