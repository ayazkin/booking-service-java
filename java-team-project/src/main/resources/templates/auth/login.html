<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Вход')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="auth-page">
    <section class="auth-panel">
        <h1>Вход</h1>

        <div class="success-message" th:if="${registered}">
            Регистрация завершена. Теперь можно войти.
        </div>
        <div class="error-message" th:if="${param.error}">
            Неверный email или пароль.
        </div>
        <div class="success-message" th:if="${param.logout}">
            Вы вышли из системы.
        </div>

        <div class="oauth-login" th:if="${googleLoginEnabled}">
            <a class="btn google-login-button" th:href="@{/oauth2/authorization/google}">
                <span class="google-mark" aria-hidden="true">G</span>
                Войти через Google
            </a>
            <div class="oauth-divider">или</div>
        </div>

        <form th:action="@{/login}" method="post" class="form">
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label>
                Email
                <input type="email" name="email" required autocomplete="username" placeholder="example@mail.com">
            </label>

            <label>
                Пароль
                <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </label>

            <button class="btn primary" type="submit">Войти</button>
        </form>

        <p class="auth-note">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </p>
    </section>
</main>
</body>
</html>
