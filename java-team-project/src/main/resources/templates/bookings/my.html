<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Мои бронирования')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <div class="page-header">
        <h1>Мои бронирования</h1>
        <a class="btn primary" th:href="@{/bookings/new}">Забронировать</a>
    </div>

    <div class="success-message" th:if="${success}" th:text="${success}">Успешно</div>
    <div class="error-message" th:if="${error}" th:text="${error}">Ошибка</div>

    <div class="empty empty-state" th:if="${bookingsPage.empty}">
        <h2>У вас пока нет бронирований</h2>
        <p>Выберите аудиторию и отправьте заявку на удобное время.</p>
        <a class="btn primary" th:href="@{/rooms}">Выбрать аудиторию</a>
    </div>

    <section class="booking-list" th:if="${!bookingsPage.empty}">
        <article class="booking-card" th:each="booking : ${bookingsPage.content}">
            <div class="booking-card-main">
                <div class="booking-title-row">
                    <h2 th:text="${booking.room.number + ' - ' + booking.room.name}">101 - Лекционная</h2>
                    <span th:class="'badge ' + ${booking.status.name().toLowerCase()}"
                          th:text="${booking.status}">APPROVED</span>
                </div>

                <dl class="booking-details">
                    <div>
                        <dt>Начало</dt>
                        <dd th:text="${#temporals.format(booking.startTime, 'dd.MM.yyyy HH:mm')}">14.05.2026 10:00</dd>
                    </div>
                    <div>
                        <dt>Конец</dt>
                        <dd th:text="${#temporals.format(booking.endTime, 'dd.MM.yyyy HH:mm')}">14.05.2026 12:00</dd>
                    </div>
                    <div>
                        <dt>Комментарий</dt>
                        <dd th:text="${booking.comment ?: '-'}">-</dd>
                    </div>
                    <div>
                        <dt>Ответ админа</dt>
                        <dd th:text="${booking.adminComment ?: '-'}">-</dd>
                    </div>
                </dl>
            </div>

            <div class="booking-actions">
                <form th:if="${booking.status.name() == 'APPROVED'}"
                      th:action="@{/bookings/{id}/cancel(id=${booking.id})}"
                      method="post">
                    <button class="btn" type="submit">Отменить</button>
                </form>
                <span class="muted" th:if="${booking.status.name() != 'APPROVED'}">Действий нет</span>
            </div>
        </article>
    </section>

    <nav class="pagination" th:if="${bookingsPage.totalPages > 1}" aria-label="Пагинация">
        <a th:if="${bookingsPage.hasPrevious()}"
           th:href="@{/bookings/my(page=${bookingsPage.number - 1},size=${bookingsPage.size})}">
            Назад
        </a>
        <span class="disabled" th:if="${!bookingsPage.hasPrevious()}">Назад</span>

        <span th:each="pageNumber : ${#numbers.sequence(0, bookingsPage.totalPages - 1)}">
            <span class="current"
                  th:if="${pageNumber == bookingsPage.number}"
                  th:text="${pageNumber + 1}">1</span>
            <a th:if="${pageNumber != bookingsPage.number}"
               th:href="@{/bookings/my(page=${pageNumber},size=${bookingsPage.size})}"
               th:text="${pageNumber + 1}">2</a>
        </span>

        <a th:if="${bookingsPage.hasNext()}"
           th:href="@{/bookings/my(page=${bookingsPage.number + 1},size=${bookingsPage.size})}">
            Вперед
        </a>
        <span class="disabled" th:if="${!bookingsPage.hasNext()}">Вперед</span>
    </nav>
</main>
</body>
</html>
