<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Новое бронирование')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow-page">
    <h1>Новое бронирование</h1>

    <form th:action="@{/bookings}" method="post">
        <div class="success-message" th:if="${success}">Заявка успешно создана</div>
        <div class="error-message" th:if="${error}" th:text="${error}">Ошибка</div>

        <label>
            Аудитория
            <select name="roomId" required>
                <option value="">Выберите аудиторию</option>
                <option th:each="room : ${rooms}"
                        th:value="${room.id}"
                        th:text="${room.number + ' - ' + room.name}"
                        th:selected="${roomId != null and room.id == roomId}">
                    101 - Лекционная
                </option>
            </select>
        </label>

        <label>
            Начало
            <input type="datetime-local" name="startTime" required th:value="${startTime}">
        </label>

        <label>
            Конец
            <input type="datetime-local" name="endTime" required th:value="${endTime}">
        </label>

        <label>
            Комментарий
            <textarea name="comment" maxlength="1000" th:text="${comment}" placeholder="Напр. для какой цели нужно помещение"></textarea>
        </label>

        <div class="actions">
            <button class="btn primary" type="submit">Создать заявку</button>
            <a class="btn" th:href="@{/rooms}">К списку аудиторий</a>
        </div>
    </form>
</main>
</body>
</html>
