<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь бронирований</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/booking-service.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/Calendar/calendar.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="calendar-page">
    <div class="page-header">
        <h1>Календарь бронирований</h1>
        <a class="btn primary" sec:authorize="isAuthenticated()" th:href="@{/bookings/new}">Новая бронь</a>
    </div>

    <div class="calendar-legend" aria-label="Обозначения календаря">
        <span class="legend-item"><span class="legend-dot legend-approved"></span> Подтверждено</span>
    </div>

    <div id="calendar-error" class="error-message calendar-error" hidden>
        Не удалось загрузить события календаря
    </div>

    <section class="calendar-shell" aria-label="Календарь занятости аудиторий">
        <div id="booking-calendar"
             th:data-events-url="@{/api/calendar/bookings}">
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/locales-all.global.min.js"></script>
<script th:src="@{/Calendar/calendar.js}"></script>
</body>
</html>
