spring.application.name=java-team-project

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.thymeleaf.cache=false

logging.file.name=logs/application.txt
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin12345}
app.admin.first-name=${APP_ADMIN_FIRST_NAME:System}
app.admin.last-name=${APP_ADMIN_LAST_NAME:Admin}
app.admin.phone=${APP_ADMIN_PHONE:}
